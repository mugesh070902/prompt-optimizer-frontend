<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Optimizer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🚀 AI Prompt Optimizer</h1>

<!-- INPUT -->
<div class="card">
  <textarea id="desc" placeholder="Describe your project..."></textarea>

  <div class="grid">
    <select id="frontend">
      <option value="">Frontend</option>
      <option>React</option>
      <option>HTML/CSS/JS</option>
    </select>

    <select id="backend">
      <option value="">Backend</option>
      <option>Spring Boot</option>
      <option>Node.js</option>
    </select>

    <select id="database">
      <option value="">Database</option>
      <option>MySQL</option>
      <option>MongoDB</option>
    </select>
  </div>

  <button onclick="generate()">Generate</button>
</div>

<!-- PROMPT OUTPUT -->
<div class="card">
  <h3>✨ Improved Prompt</h3>
  <pre id="promptBox"></pre>
  <button onclick="copyPrompt()">Copy Prompt</button>
</div>

<!-- AGENT MD -->
<div class="card">
  <h3>📄 agent.md</h3>
  <pre id="agentBox"></pre>
  <button onclick="copyAgent()">Copy Agent</button>
</div>

<!-- STATS -->
<div class="card">
  <h3>📊 Optimization Stats</h3>
  <p>🔢 Tokens Saved: <span id="tokens">0</span></p>
  <p>💰 Cost Saved: <span id="cost">0</span></p>
</div>

<!-- HISTORY -->
<div class="card">
  <h3>📜 History</h3>
  <div id="history"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
