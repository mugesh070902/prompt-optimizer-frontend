<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Prompt Optimizer Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
<h2>🚀 AI Prompt Optimizer</h2>

<div class="top-actions">
<span id="userName">User</span>
<button onclick="logout()">Logout</button>
</div>
</header>

<div class="container">

<section class="card">
<h2>Project Input</h2>

<textarea
id="desc"
placeholder="Describe your project..."
></textarea>

<div class="grid">

<select id="frontend">
<option value="">Frontend</option>
<option>React</option>
<option>Angular</option>
<option>Vue</option>
<option>HTML/CSS/JS</option>
<option>Next.js</option>
</select>

<select id="backend">
<option value="">Backend</option>
<option>Spring Boot</option>
<option>Node.js</option>
<option>Laravel</option>
<option>FastAPI</option>
</select>

<select id="database">
<option value="">Database</option>
<option>MySQL</option>
<option>PostgreSQL</option>
<option>MongoDB</option>
</select>

</div>

<button onclick="generate()" class="primary-btn">
Generate
</button>

</section>


<section class="card">
<h2>✨ Improved Prompt</h2>
<pre id="promptBox">Your optimized prompt will appear here...</pre>

<div class="btn-row">
<button onclick="copyPrompt()">Copy Prompt</button>
</div>
</section>


<section class="card">
<h2>📄 agent.md</h2>
<pre id="agentBox">Generated agent instructions will appear here...</pre>

<div class="btn-row">
<button onclick="copyAgent()">Copy Agent</button>
<button onclick="downloadAgent()">Download agent.md</button>
</div>
</section>


<section class="card stats-grid">
<div class="stat-box">
<h3>Tokens Saved</h3>
<p id="tokens">0</p>
</div>

<div class="stat-box">
<h3>Cost Saved</h3>
<p id="cost">0.000000</p>
</div>
</section>


<section class="card">
<h2>📜 My History</h2>
<div id="history"></div>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
